<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bump ?v= on the css/js links below whenever those files change, so browsers don't mix old and new files. -->
  <title>Gacha Banner Calendar</title>
  <meta name="description" content="Rate-up banner calendar for Genshin Impact, Honkai: Star Rail, Zenless Zone Zero, Wuthering Waves, Arknights: Endfield, Neverness to Everness, Girls' Frontline 2, Madoka Magica Exedra, Uma Musume, Blue Archive, Fate/Grand Order and BanG Dream, Arknights, Azur Lane, Princess Connect, Project Sekai, Reverse: 1999 and hololive Dreams." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css?v=20261115b" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <div class="lang-bar" id="lang-bar" role="group" aria-label="Language / 语言">
    <span class="globe" aria-hidden="true">🌐</span>
    <button type="button" data-lang="en">English</button>
    <button type="button" data-lang="zh">简体中文</button>
  </div>

  <button class="version-badge" id="version-badge" type="button" aria-haspopup="dialog"></button>
  <dialog class="history" id="history" aria-labelledby="history-title">
    <div class="history-head">
      <h2 id="history-title" data-i18n="historyTitle"></h2>
      <button class="history-close" id="history-close" type="button" aria-label="Close">✕</button>
    </div>
    <div id="history-list"></div>
  </dialog>

  <header class="hero">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="sub"></p>
    <p class="range"><span id="range-text"></span><span class="range-note" data-i18n="rangeNote"></span></p>
  </header>

  <nav class="toolbar" aria-label="Filters">
    <div class="toolbar-row">
      <button class="btn filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="game-filters">
        <span data-i18n="games"></span> <span class="filter-count" id="filter-count"></span><span class="caret" aria-hidden="true">▾</span>
      </button>
      <div class="selected-icons" id="selected-icons" aria-hidden="true"></div>
      <div class="toolbar-right">
        <label class="toggle"><input type="checkbox" id="only-upcoming" /> <span data-i18n="onlyUpcoming"></span></label>
        <label class="toggle" id="show-past-label"><input type="checkbox" id="show-past" /> <span data-i18n="showPast"></span></label>
        <button class="btn" id="ics-btn" type="button" data-i18n="exportIcs"></button>
      </div>
    </div>
    <div class="chips" id="game-filters" hidden></div>
  </nav>

  <section class="live" id="live-section" aria-labelledby="live-title">
    <h2 id="live-title">
      <button class="live-toggle" id="live-toggle" type="button" aria-expanded="false" aria-controls="live-grid">
        <span class="pulse"></span><span data-i18n="liveNow"></span> <span class="live-count" id="live-count"></span><span class="caret" aria-hidden="true">▾</span>
      </button>
      <span class="selected-icons live-icons" id="live-icons" aria-hidden="true"></span>
      <span class="live-sort" id="live-sort" role="group">
        <span class="live-sort-lbl" data-i18n="sortBy"></span>
        <button type="button" data-sort="default" data-i18n="sortDefault"></button>
        <button type="button" data-sort="ending" data-i18n="sortEnding"></button>
      </span>
    </h2>
    <div class="live-grid" id="live-grid" hidden></div>
  </section>

  <main id="calendar"></main>

  <footer class="foot">
    <div class="legend" id="legend"></div>
    <p><span id="foot-text"></span> <code>data/banners.js</code></p>
  </footer>

  <script src="data/banners.js?v=20261115b"></script>
  <script src="data/economy.js?v=20261115b"></script>
  <script src="data/changelog.js?v=20261115b"></script>
  <script src="assets/app.js?v=20261115b"></script>
</body>
</html>
